<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>Kaylee English - Forever Young</title>
<style>
:root{--ink:#18212f;--muted:#6d7686;--brand:#6d5dfc;--brand2:#8b7cff;--good:#18864b;--bad:#c53b4a;--line:#e6e9f0;--soft:#f0efff}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#f7f7ff,#eef2f8);color:var(--ink);min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 4px}.sub{margin:0;color:var(--muted);font-size:14px}
.pill{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(28,38,58,.08);padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;text-align:left;cursor:pointer;min-height:112px}
.mode strong{display:block;font-size:17px;margin-bottom:6px}.mode span{font-size:13px;color:var(--muted)}
.mode.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none}.mode.primary span{color:#ece9ff}
.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}.bar{height:10px;background:#eceef4;border-radius:999px;overflow:hidden;margin-bottom:18px}.bar>div{height:100%;background:linear-gradient(90deg,var(--brand),#9a8cff);width:0%}
.qtype{display:inline-block;background:var(--soft);color:#5144d7;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;margin-bottom:12px}
.question{font-size:23px;font-weight:800;line-height:1.3;margin:4px 0 14px}.hint{font-size:14px;color:var(--muted);margin-bottom:14px}
input{width:100%;font-size:18px;padding:15px 16px;border-radius:14px;border:1.5px solid #ccd2dc;outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(109,93,252,.12)}
.actions{display:flex;gap:10px;margin-top:14px}.btn{flex:1;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer}.primarybtn{background:var(--brand);color:#fff}.secondary{background:#eef0f5;color:#283243}
.feedback{margin-top:14px;border-radius:14px;padding:12px 14px;font-weight:700;display:none}.feedback.good{display:block;background:#e9f7ef;color:var(--good)}.feedback.bad{display:block;background:#fdecef;color:var(--bad)}
.score{font-size:52px;font-weight:900;text-align:center;margin:8px 0}.center{text-align:center}.muted{color:var(--muted)}.errors{margin-top:18px}.item{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.small{font-size:12px;color:var(--muted)}
@media(max-width:560px){.grid{grid-template-columns:1fr}.question{font-size:21px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Kaylee English</h1><p class="sub">Forever Young</p></div>
    <div class="pill" id="scorePill">0 goed</div>
  </div>

  <section id="home" class="card">
    <h2 style="margin-top:0">Hi Kaylee 👋</h2>
    <p class="muted">Oefen de nieuwe les. Een klein typfoutje telt niet meteen fout.</p>
    <div class="grid">
      <button class="mode primary" onclick="start('mixed')"><strong>Alles door elkaar</strong><span>Woorden, phrases en can / have to</span></button>
      <button class="mode" onclick="start('words')"><strong>Woorden</strong><span>Nederlands ↔ Engels</span></button>
      <button class="mode" onclick="start('phrases')"><strong>Phrases</strong><span>Zinnen vertalen</span></button>
      <button class="mode" onclick="start('grammar')"><strong>Can / have to</strong><span>Kunnen, mogen, moeten en niet hoeven</span></button>
      <button class="mode" onclick="start('mistakes')"><strong>Mijn fouten</strong><span>Oefen wat nog lastig is</span></button>
      <button class="mode" onclick="start('test')"><strong>Eindtoets</strong><span>20 vragen zonder hints</span></button>
    </div>
  </section>

  <section id="quiz" class="card" style="display:none">
    <div class="progress-head"><span id="count"></span><span id="scoreNow"></span></div>
    <div class="bar"><div id="bar"></div></div>
    <div id="qtype" class="qtype"></div>
    <div id="question" class="question"></div>
    <div id="hint" class="hint"></div>
    <input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Typ je antwoord…">
    <div id="feedback" class="feedback"></div>
    <div class="actions">
      <button class="btn secondary" onclick="goHome()">Stoppen</button>
      <button id="checkBtn" class="btn primarybtn" onclick="check()">Controleren</button>
      <button id="nextBtn" class="btn primarybtn" onclick="next()" style="display:none">Volgende</button>
    </div>
  </section>

  <section id="done" class="card" style="display:none">
    <div class="qtype">Klaar!</div>
    <div class="score" id="finalScore">0%</div>
    <h2 class="center" id="finalTitle">Goed gedaan!</h2>
    <p class="muted center" id="finalText"></p>
    <div id="errorList" class="errors"></div>
    <div class="actions">
      <button class="btn secondary" onclick="goHome()">Terug</button>
      <button class="btn primarybtn" onclick="start('mistakes')">Oefen mijn fouten</button>
    </div>
  </section>
</div>

<script>
const WORDS=[
['forever','voor altijd'],['young','jong'],['old','oud'],['healthier','gezonder'],['fitter','fitter'],
['fear','angst'],['job','baan'],['drive a car','autorijden'],['time to play','tijd om te spelen'],
['do nothing','niets doen'],['change','veranderen'],['fizzy drink','frisdrank'],['look forward to','uitkijken naar'],
['decide','besluiten'],['chore','klusje'],['stay up late','laat opblijven'],['go on holiday alone','alleen op vakantie gaan'],
['listen to your parents','naar je ouders luisteren'],['take care of everything','overal voor zorgen'],
['live on my own','op mezelf wonen'],['earn money','geld verdienen'],['make choices','keuzes maken'],['pay the bills','de rekeningen betalen']
];

const PHRASES=[
['What do you like about being young?','Wat vind je leuk aan jong zijn?'],
["It's nice being young because you have a lot of free time.",'Het is leuk om jong te zijn, omdat je dan veel vrije tijd hebt.'],
["What don't you like about being young?",'Wat vind je niet leuk aan jong zijn?'],
['What is your ideal age?','Wat is jouw ideale leeftijd?'],
['My ideal age is 24 years old.','Mijn ideale leeftijd is 24.']
];

const GRAMMAR=[
{q:'Ik mag buitenspelen. → I ___ play outside.',a:'can',alts:[],h:'Can = iets kunnen of mogen.'},
{q:'Je mag niet eten wat je lekker vindt. → You ___ eat what you like.',a:"can't",alts:['cannot'],h:"Can't = niet mogen of niet kunnen."},
{q:'Ik moet mijn huiswerk doen. → I ___ do my homework.',a:'have to',alts:[],h:'Have to = moeten.'},
{q:'Je hoeft geen eten te koken. → You ___ cook dinner.',a:"don't have to",alts:['do not have to'],h:"Don't have to = niet hoeven."},
{q:'Wat betekent “have to”?',a:'moeten',alts:['moet'],h:''},
{q:'Wat betekent “can”?',a:'kunnen',alts:['mogen','kan','mag'],h:''},
{q:'Wat betekent “don’t have to”?',a:'niet hoeven',alts:['hoeft niet'],h:''},
{q:'Wat betekent “can’t”?',a:'niet mogen',alts:['niet kunnen','mag niet','kan niet'],h:''}
];

let queue=[],current=null,idx=0,correct=0,wrong=[],mode='mixed',awaiting=false;

function norm(s){return s.toLowerCase().trim().replace(/[.,!?]/g,'').replace(/\s+/g,' ').replace(/[’]/g,"'")}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function editDistance(a,b){
 const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=0;i<=m;i++)dp[i][0]=i;
 for(let j=0;j<=n;j++)dp[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return dp[m][n]
}
function wordQuestions(){
 const q=[];
 WORDS.forEach(([en,nl])=>{
   q.push({type:'Woord',q:'Wat is “'+nl+'” in het Engels?',a:en,alts:[],h:''});
   q.push({type:'Woord',q:'Wat betekent “'+en+'”?',a:nl,alts:[],h:''});
 });
 return q
}
function phraseQuestions(){
 const q=[];
 PHRASES.forEach(([en,nl])=>{
   q.push({type:'Phrase',q:'Vertaal naar het Nederlands:',lead:en,a:nl,alts:[],h:''});
   q.push({type:'Phrase',q:'Vertaal naar het Engels:',lead:nl,a:en,alts:[],h:''});
 });
 return q
}
function grammarQuestions(){return GRAMMAR.map(x=>({type:'Grammar',...x}))}

function start(m){
 mode=m;correct=0;wrong=[];idx=0;awaiting=false;
 let base=[];
 if(m==='words')base=shuffle(wordQuestions()).slice(0,20);
 if(m==='phrases')base=shuffle(phraseQuestions());
 if(m==='grammar')base=shuffle(grammarQuestions());
 if(m==='mixed')base=shuffle([...wordQuestions(),...phraseQuestions(),...grammarQuestions()]).slice(0,25);
 if(m==='test')base=shuffle([...wordQuestions(),...phraseQuestions(),...grammarQuestions()]).slice(0,20).map(x=>({...x,h:''}));
 if(m==='mistakes'){
   const saved=JSON.parse(localStorage.getItem('kaylee_forever_mistakes')||'[]');
   base=saved.length?saved:shuffle([...wordQuestions(),...grammarQuestions()]).slice(0,10)
 }
 queue=base;
 document.getElementById('home').style.display='none';
 document.getElementById('done').style.display='none';
 document.getElementById('quiz').style.display='block';
 render()
}

function render(){
 if(idx>=queue.length){finish();return}
 current=queue[idx];awaiting=false;
 document.getElementById('qtype').textContent=current.type;
 document.getElementById('question').innerHTML=current.lead?current.q+'<br><span style="font-size:19px;font-weight:700;color:#5144d7">'+current.lead+'</span>':current.q;
 document.getElementById('hint').textContent=mode==='test'?'':(current.h||'');
 const a=document.getElementById('answer');a.value='';a.disabled=false;
 const fb=document.getElementById('feedback');fb.className='feedback';fb.textContent='';
 document.getElementById('checkBtn').style.display='block';
 document.getElementById('nextBtn').style.display='none';
 document.getElementById('count').textContent=(idx+1)+' / '+queue.length;
 document.getElementById('scoreNow').textContent=correct+' goed';
 document.getElementById('bar').style.width=((idx/queue.length)*100)+'%';
 setTimeout(()=>a.focus(),100)
}

function check(){
 if(awaiting)return;
 const val=norm(document.getElementById('answer').value);
 if(!val)return;
 const accepted=[current.a,...(current.alts||[])].map(norm);
 const ok=accepted.includes(val);
 const best=Math.min(...accepted.map(a=>editDistance(val,a)));
 const typoClose=!ok && current.type==='Woord' && best===1 && val.length>=4;
 const maxLen=Math.max(val.length,...accepted.map(x=>x.length));
 const phraseClose=!ok && current.type==='Phrase' && best<=Math.max(1,Math.floor(maxLen*0.06));

 awaiting=true;
 document.getElementById('answer').disabled=true;
 document.getElementById('checkBtn').style.display='none';
 document.getElementById('nextBtn').style.display='block';
 const fb=document.getElementById('feedback');

 if(ok){
   correct++;fb.className='feedback good';fb.textContent='Goed! ✓'
 }else if(typoClose||phraseClose){
   correct++;fb.className='feedback good';fb.innerHTML='Bijna helemaal goed ✓ Alleen even opletten met de spelling:<br><strong>'+current.a+'</strong>'
 }else{
   wrong.push(current);fb.className='feedback bad';fb.innerHTML='Nog niet helemaal. Het goede antwoord is:<br><strong>'+current.a+'</strong>';
   if(mode!=='test')queue.push({...current,repeat:true})
 }
 document.getElementById('scoreNow').textContent=correct+' goed';
 document.getElementById('scorePill').textContent=correct+' goed'
}
function next(){idx++;render()}

function finish(){
 document.getElementById('quiz').style.display='none';
 document.getElementById('done').style.display='block';
 const total=Math.max(1,idx),pct=Math.round(correct/total*100);
 document.getElementById('finalScore').textContent=pct+'%';
 document.getElementById('finalTitle').textContent=pct>=85?'Super gedaan!':pct>=65?'Goed bezig!':'Nog even oefenen';
 document.getElementById('finalText').textContent='Je had '+correct+' van de '+total+' vragen goed.';
 const unique=[],seen=new Set();
 wrong.forEach(x=>{const k=x.type+'|'+x.q+'|'+(x.lead||'');if(!seen.has(k)){seen.add(k);unique.push(x)}});
 localStorage.setItem('kaylee_forever_mistakes',JSON.stringify(unique.slice(0,50)));
 document.getElementById('errorList').innerHTML=unique.length
 ?'<h3>Deze nog oefenen</h3>'+unique.slice(0,8).map(x=>'<div class="item"><strong>'+x.q+'</strong><br><span class="small">'+(x.lead?x.lead+' → ':'')+x.a+'</span></div>').join('')
 :'<p class="center">Geen fouten. Netjes!</p>'
}
function goHome(){
 document.getElementById('quiz').style.display='none';
 document.getElementById('done').style.display='none';
 document.getElementById('home').style.display='block'
}
document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){awaiting?next():check()}});
</script>
</body>
</html>
