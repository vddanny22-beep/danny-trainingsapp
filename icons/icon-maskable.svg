<!-- Maskable source: square full-bleed background (a launcher may crop this to
     any shape, and rounded corners would show through as transparency) with
     the barbell scaled to 80% so it stays inside the maskable safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0f1115"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)" stroke="#a3e635" stroke-width="28" stroke-linecap="round">
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="140" y1="176" x2="140" y2="336"/>
    <line x1="372" y1="176" x2="372" y2="336"/>
    <line x1="88" y1="206" x2="88" y2="306"/>
    <line x1="424" y1="206" x2="424" y2="306"/>
  </g>
</svg>
