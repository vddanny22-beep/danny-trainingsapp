<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the app paint into the notch/home-indicator
       areas; css/style.css pads content back with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Training" />
  <title>Trainingsschema</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <!-- iOS ignores SVG here, so the home-screen icon must be a PNG. -->
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Trainingsschema</h1>
  </header>

  <main id="content"></main>

  <nav class="app-nav">
    <div class="nav-indicator" aria-hidden="true"></div>
    <button id="nav-today" class="nav-btn active">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6M20 9v6M7.5 6v12M16.5 6v12M7.5 12h9" />
      </svg>
      <span>Vandaag</span>
    </button>
    <button id="nav-history" class="nav-btn">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3.5 2" />
      </svg>
      <span>Historie</span>
    </button>
    <button id="nav-schema" class="nav-btn">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M3 10h18M8 3v4M16 3v4" />
      </svg>
      <span>Schema</span>
    </button>
    <button id="nav-progress" class="nav-btn">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4v16h16" />
        <path d="M7.5 14.5l3.5-4 3 2.5 4.5-6" />
      </svg>
      <span>Voortgang</span>
    </button>
    <button id="nav-chat" class="nav-btn">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14a3 3 0 0 1-3 3H8.5L4.5 20.5V6a3 3 0 0 1 3-3h9.5a3 3 0 0 1 3 3z" />
      </svg>
      <span>Coach</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
